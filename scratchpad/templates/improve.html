<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Prompt Improver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .nav a {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav a.active {
            background: #667eea;
            color: white;
        }

        .nav a:not(.active) {
            color: #666;
            background: #f5f5f5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.05em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1em;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px 28px;
            font-size: 1.05em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-improve {
            background: #667eea;
            color: white;
        }

        .btn-improve:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-improve:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #f5f5f5;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .results {
            margin-top: 40px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .result-text {
            background: white;
            padding: 15px;
            border-radius: 6px;
            color: #444;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .error {
            background: #fee;
            border-left-color: #d32f2f;
            color: #d32f2f;
        }

        .success {
            background: #f0f7ff;
            border-left-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Claude Prompt Improver</h1>
            <p>Enhance your prompts with AI-powered improvements</p>
        </div>

        <div class="nav">
            <a href="/" class="active">Improve Prompt</a>
            <a href="/compare">Compare Results</a>
        </div>

        <div class="form-group">
            <label for="prompt">Enter Your Prompt:</label>
            <textarea id="prompt" placeholder="Paste your prompt here..."></textarea>
        </div>

        <div class="button-group">
            <button class="btn-improve" onclick="improvePrompt()">Improve with Claude</button>
            <button class="btn-clear" onclick="clearForm()">Clear</button>
        </div>

        <div class="results" id="results">
            <div class="result-section success" id="original-result">
                <h3>📝 Your Original Prompt:</h3>
                <div class="result-text" id="original-text"></div>
            </div>

            <div class="result-section success" id="improved-result">
                <h3>✨ Claude Improved Prompt:</h3>
                <div class="result-text" id="improved-text"></div>
                <button class="copy-btn" onclick="copyToClipboard('improved-text')">📋 Copy</button>
            </div>

            <div class="result-section error" id="error-result" style="display: none;">
                <h3>⚠️ Error:</h3>
                <div class="result-text" id="error-text"></div>
            </div>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="color: #667eea; margin-top: 15px; font-weight: 500;">Improving your prompt...</p>
        </div>

        <div class="footer">
            <p>💡 Claude is a large language model. Results may vary based on the input.</p>
        </div>
    </div>

    <script>
        async function improvePrompt() {
            const prompt = document.getElementById('prompt').value.trim();

            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const errorResult = document.getElementById('error-result');

            loading.style.display = 'block';
            results.style.display = 'none';
            errorResult.style.display = 'none';

            try {
                const response = await fetch('/api/improve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('original-text').textContent = data.deficient_prompt;
                    document.getElementById('improved-text').textContent = data.claude_improved;

                    loading.style.display = 'none';
                    results.classList.add('show');
                    results.style.display = 'block';

                    // Scroll to results
                    setTimeout(() => {
                        document.getElementById('improved-result').scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                } else {
                    throw new Error(data.error || 'Failed to improve prompt');
                }
            } catch (error) {
                document.getElementById('error-text').textContent = error.message;
                loading.style.display = 'none';
                errorResult.style.display = 'block';
            }
        }

        function clearForm() {
            document.getElementById('prompt').value = '';
            document.getElementById('results').classList.remove('show');
            document.getElementById('results').style.display = 'none';
            document.getElementById('prompt').focus();
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }

        // Allow Enter to submit
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                improvePrompt();
            }
        });
    </script>
</body>
</html>
