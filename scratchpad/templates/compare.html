<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Prompts - Claude Prompt Improver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .nav a {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav a.active {
            background: #667eea;
            color: white;
        }

        .nav a:not(.active) {
            color: #666;
            background: #f5f5f5;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .comparisons {
            margin-top: 30px;
        }

        .comparison-item {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .comparison-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .comparison-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            font-weight: 600;
        }

        .comparison-content {
            padding: 20px;
        }

        .prompt-section {
            margin-bottom: 20px;
        }

        .prompt-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .prompt-text {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            color: #444;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.95em;
            max-height: 200px;
            overflow-y: auto;
        }

        .comparison-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .column {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
        }

        .column h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .column.claude h4 {
            color: #667eea;
        }

        .column.project h4 {
            color: #764ba2;
        }

        .column-text {
            color: #444;
            line-height: 1.6;
            word-wrap: break-word;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9em;
        }

        .similarity {
            margin-top: 15px;
            padding: 12px;
            background: #f0f7ff;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-text {
            color: #999;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        @media (max-width: 768px) {
            .comparison-columns {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Compare Improvements</h1>
            <p>Claude vs Your Project Prompts</p>
        </div>

        <div class="nav">
            <a href="/">Improve Prompt</a>
            <a href="/compare" class="active">Compare Results</a>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="loadSamples('test')">Test 5 Samples</button>
            <button class="btn-primary" onclick="loadSamples('all')">Load All 50</button>
            <button class="btn-primary" onclick="clearResults()">Clear</button>
        </div>

        <div class="info-text">
            💡 Test samples will improve with Claude and compare with your project's improvements
        </div>

        <div class="comparisons" id="comparisons"></div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p style="color: #667eea; margin-top: 15px; font-weight: 500;">Loading and comparing prompts...</p>
            <p style="color: #999; margin-top: 10px;">This may take a minute...</p>
        </div>
    </div>

    <script>
        let allResults = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        async function loadSamples(mode) {
            const loading = document.getElementById('loading');
            const comparisons = document.getElementById('comparisons');

            loading.style.display = 'block';
            comparisons.innerHTML = '';
            allResults = [];

            try {
                // Get all samples
                const response = await fetch('/api/compare-all');
                const samples = await response.json();

                // Determine how many to test
                const testCount = mode === 'all' ? samples.length : Math.min(5, samples.length);
                const samplesToTest = samples.slice(0, testCount);

                // Get sample IDs
                const sampleIds = samplesToTest.map(s => s.sample_id);

                // Compare them
                const compareResponse = await fetch('/api/compare-samples', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sample_ids: sampleIds })
                });

                const results = await compareResponse.json();
                allResults = results;

                loading.style.display = 'none';
                displayComparisons(results);

            } catch (error) {
                loading.style.display = 'none';
                comparisons.innerHTML = `<div style="color: red; padding: 20px;">Error: ${error.message}</div>`;
            }
        }

        function displayComparisons(results) {
            const comparisons = document.getElementById('comparisons');
            comparisons.innerHTML = '';

            results.forEach((result, index) => {
                const item = document.createElement('div');
                item.className = 'comparison-item';

                const claudeLength = result.claude_improved ? result.claude_improved.length : 0;
                const projectLength = result.project_improved ? result.project_improved.length : 0;
                const similarity = result.similarity ? (result.similarity * 100).toFixed(1) : 0;

                item.innerHTML = `
                    <div class="comparison-header">
                        ${result.sample_id} - ${result.deficient_prompt.substring(0, 50)}...
                    </div>
                    <div class="comparison-content">
                        <div class="prompt-section">
                            <div class="prompt-label">📝 Original Deficient Prompt:</div>
                            <div class="prompt-text">${escapeHtml(result.deficient_prompt)}</div>
                        </div>

                        <div class="comparison-columns">
                            <div class="column claude">
                                <h4>🤖 Claude Improved (${claudeLength} chars)</h4>
                                <div class="column-text">${escapeHtml(result.claude_improved)}</div>
                            </div>
                            <div class="column project">
                                <h4>🎯 Your Project (${projectLength} chars)</h4>
                                <div class="column-text">${escapeHtml(result.project_improved)}</div>
                            </div>
                        </div>

                        <div class="similarity">
                            ↔️ Similarity: ${similarity}%
                        </div>
                    </div>
                `;

                comparisons.appendChild(item);
            });

            if (results.length === 0) {
                comparisons.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No results to display</div>';
            }
        }

        function clearResults() {
            document.getElementById('comparisons').innerHTML = '';
            allResults = [];
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
