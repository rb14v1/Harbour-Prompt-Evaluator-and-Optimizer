# Managed by Harbour. Rewritten on every BUILD.
name: Harbour security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gitleaks detect --source . --redact --verbose --exit-code 1
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --severity ERROR --error --metrics=off .
  sca:
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.59.1
    steps:
      - uses: actions/checkout@v4
      - run: trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .
  # Advisory only. Lists CRITICAL and HIGH CVEs that have no fix yet, so they stay visible without failing the workflow.
  sca-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: aquasec/trivy:0.59.1
    steps:
      - uses: actions/checkout@v4
      - run: trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 0 --format table .
