# Frontend: Vite app in frontend/. Build output is frontend/dist.

.frontend-changes: &frontend-changes
  changes:
    - frontend/**/*

frontend:lint:
  stage: test
  image: node:22
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      <<: *frontend-changes
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend:build:
  stage: build
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      <<: *frontend-changes
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

frontend:deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  needs: [frontend:build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *frontend-changes
      when: manual
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - cd frontend/dist && python3 -c "import shutil; shutil.make_archive('../../frontend-app', 'zip', '.')" && cd ../..
    - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --src-path frontend-app.zip --type zip
  artifacts:
    paths:
      - frontend-app.zip
    expire_in: 1 week
