# Backend: Django app lives at repo root (manage.py), so paths below are repo-relative.

.backend-changes: &backend-changes
  changes:
    - requirements.txt
    - manage.py
    - backend/**/*
    - evaluator/**/*

backend:test:
  stage: test
  image: python:3.13
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      <<: *backend-changes
  variables:
    POSTGRES_HOST: ""
    DJANGO_SECRET_KEY: "ci-test-only-key"
    PYTHONUTF8: "1"
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py test evaluator

backend:deploy:
  stage: deploy
  image: python:3.13
  needs: [backend:test]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "prompt_final_clean_to_main"
      <<: *backend-changes
      when: manual
  variables:
    PYTHONUTF8: "1"
  script:
    - python -m zipfile -c app.zip manage.py requirements.txt backend evaluator
    - python ci/zipdeploy.py BACKEND_PUBLISH_PROFILE app.zip
  artifacts:
    paths:
      - app.zip
    expire_in: 1 week
